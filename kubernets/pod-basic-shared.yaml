apiVersion: v1
kind: Pod
metadata:
  name: shared-volume-pod
spec:
  volumes:
  - name: shared-data
    emptyDir: {}

  containers:
    - name: written-container
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
       - >
          while true; do
           echo "data written at $(date)" >> /var/log/shared/output.txt
           sleep 5;
          done
      volumeMounts:
        - name: shared-data
          mountPath: /var/log/shared
    - name: reader-container
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
      - >
        sleep 2;
        tail -f /data/output.txt
      volumeMounts:
      - name: shared-data
        mountPath: /data
