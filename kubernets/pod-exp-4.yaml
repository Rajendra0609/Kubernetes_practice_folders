apiVersion: v1
kind: Pod
metadata:
  name: zero-downtime-app
spec:
  terminationGracePeriodSeconds: 60
  containers:
    - name: web-app
      image: nginx:latest
      lifecycle:
         prestop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]


[kubectl delete pod]
       │
       ▼
┌────────────────────────────────────────────────────────┐
│ API Server sets DeletionTimestamp & Grace Period Clock │
└────────────────────────────────────────────────────────┘
       │
       ├──────────────────────────────────────┐ (Parallel Track)
       ▼                                      ▼
┌─────────────────────────────┐        ┌──────────────────────────────┐
│  Track A: Control Plane     │        │  Track B: Data Plane (Node)  │
│  Endpoint & Routing Removal │        │  Kubelet Execution           │
└─────────────────────────────┘        └──────────────────────────────┘
       │                                      │
       ▼                                      ▼
┌─────────────────────────────┐        ┌──────────────────────────────┐
│ 1. EndpointSlice updated    │        │ 1. Executes preStop Hook     │
│    (Removed from endpoints) │        │    (If configured)           │
└─────────────────────────────┘        └──────────────────────────────┘
       │                                      │
       ▼                                      ▼
┌─────────────────────────────┐        ┌──────────────────────────────┐
│ 2. Ingress Controller /     │        │ 2. Sends SIGTERM             │
│    Kube-Proxy updates rules │        │    (App begins shutting down)│
└─────────────────────────────┘        └──────────────────────────────┘
       │                                      │
       │                                      ▼
       │                               ┌──────────────────────────────┐
       │                               │ 3. Grace Period Expires      │
       │                               └──────────────────────────────┘
       │                                      │
       │                                      ▼
       └─────────────────────────────────────►│ 4. Sends SIGKILL             │
                                               │    (Process forced dead)     │
                                               └──────────────────────────────┘