apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwx-writer
  namespace: rwx-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rwx-writer
  template:
    metadata:
      labels:
        app: rwx-writer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rwx-writer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              FILE="/shared/${POD_NAME}.log"

              while true; do
                printf '%s | pod=%s | node=%s\n' \
                  "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
                  "$POD_NAME" \
                  "$NODE_NAME" >> "$FILE"

                sleep 5
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: nfs-rwx-pvc
